name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: arrange files
        run: |
          mkdir -p src/main/java/example/dualserver/mixin
          mkdir -p src/main/resources/assets/dualserver/lang
          mv DualServerClient.java Session.java SessionManager.java src/main/java/example/dualserver/
          mv MinecraftClientMixin.java src/main/java/example/dualserver/mixin/
          mv fabric.mod.json dualserver.mixins.json src/main/resources/
          mv en_us.json ja_jp.json src/main/resources/assets/dualserver/lang/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: dualserver-jar
          path: build/libs/*.jar
